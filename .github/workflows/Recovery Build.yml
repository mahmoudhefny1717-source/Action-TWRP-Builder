name: TWRP Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP Manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-10.0'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/mahmoudhefny1717-source/twrp_device_infinix_X680'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Path in Source Tree'
        required: true
        default: 'device/infinix/Infinix-X680'
      DEVICE_NAME:
        description: 'Device Name (Target Product)'
        required: true
        default: 'Infinix-X680'
      MAKEFILE_NAME:
        description: 'Makefile Name'
        required: true
        default: 'omni_Infinix-X680'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup & Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk git-core diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect \
            xz-utils debianutils iputils-ping python3-git python3-jinja2 \
            libegl1-mesa libsdl1.2-dev xterm python3-subunit \
            mesa-common-dev zstd liblz4-tool libssl-dev bc bison flex \
            gnupg gperf lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            zip curl lzop libncurses5-dev libncursesw5-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize and Sync Repo
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd workspace
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: Build TWRP
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng || lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Recovery Image to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Recovery-${{ github.event.inputs.DEVICE_NAME }}
          path: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
